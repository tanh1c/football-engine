<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Football Engine 2D Viewer</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b1721; color: #fff; font-family: system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #111f2d; }
      button { border: 0; border-radius: 6px; padding: 8px 12px; background: #2ecc71; color: #06130b; font-weight: 700; cursor: pointer; }
      button.secondary { background: #95a5a6; }
      code { color: #f1c40f; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <header>
      <strong>FM-like 2D Match Viewer</strong>
      <button id="play">Play</button>
      <button id="pause" class="secondary">Pause</button>
      <button id="prev" class="secondary">Prev</button>
      <button id="next" class="secondary">Next</button>
      <label>Speed
        <select id="speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </label>
      <span>Load frames from <code>tmp/demo-match.json</code> generated by <code>npm run simulate</code>.</span>
    </header>
    <canvas id="pitch"></canvas>
    <script type="module">
      import { createMatchViewer } from '../src/viewer/render.js'

      const viewer = createMatchViewer(document.getElementById('pitch'))
      document.getElementById('play').addEventListener('click', () => viewer.play())
      document.getElementById('pause').addEventListener('click', () => viewer.pause())
      document.getElementById('prev').addEventListener('click', () => viewer.previous())
      document.getElementById('next').addEventListener('click', () => viewer.next())
      document.getElementById('speed').addEventListener('change', event => viewer.setSpeed(event.target.value))

      try {
        const response = await fetch('../tmp/demo-match.json')
        if (response.ok) {
          const data = await response.json()
          viewer.setFrames(data.frames)
        }
      } catch (error) {
        console.warn('Run npm run simulate before opening this viewer.', error)
      }
    </script>
  </body>
</html>
